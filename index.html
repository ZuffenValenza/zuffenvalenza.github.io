<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Oficial | Zuffen & Valenza Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- BIBLIOTECAS DO GOOGLE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #070709; 
            --surface-dark: rgba(20, 20, 25, 0.7); 
            --brand-gold: #D4AF37;
            --brand-gold-hover: #F3E5AB;
            --text-main: #f0f0f0;
            --text-muted: #8a8a93;
            --border-glass: rgba(255, 255, 255, 0.08);
            --studio-light: #e8e8e8; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.03), transparent 30%),
                radial-gradient(circle at 85% 10%, rgba(255, 255, 255, 0.02), transparent 30%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        header {
            background: rgba(7, 7, 9, 0.8);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            text-align: center; 
            padding: 30px 20px 25px 20px; 
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .logo-topo { max-width: 250px; width: 100%; display: block; margin: 0 auto; filter: drop-shadow(0 0 15px rgba(212,175,55,0.2)); }
        .tagline-marca { font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 300; color: var(--brand-gold); letter-spacing: 5px; text-transform: uppercase; margin-top: 15px; opacity: 0.9; }

        .container-produtos { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
        .secao-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .titulo-secao { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 1px; }

        .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 35px; padding-bottom: 80px; }
        .card-vitrine {
            background: var(--surface-dark); border: 1px solid var(--border-glass); border-radius: 16px;
            padding: 12px; cursor: pointer; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); text-align: center;
        }
        .card-vitrine:hover { 
            transform: translateY(-8px); 
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.05);
        }
        .img-container {
            width: 100%; height: 320px; background-color: var(--studio-light); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px;
        }
        .card-vitrine img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; transition: transform 0.5s; }
        .card-vitrine:hover img { transform: scale(1.05); }
        .card-vitrine .nome { font-size: 1rem; font-weight: 400; color: #fff; margin-bottom: 8px; letter-spacing: 0.5px; }
        .card-vitrine .preco { font-family: 'Montserrat', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--brand-gold); }

        /* MODAL DE PRODUTO */
        .modal-produto-fundo {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .modal-produto-fundo.ativo { display: flex; animation: fadeIn 0.3s ease-out; }
        .modal-produto-conteudo {
            background: var(--surface-dark); border: 1px solid var(--border-glass);
            width: 95%; max-width: 950px; max-height: 90vh; border-radius: 20px; 
            overflow-y: auto; position: relative; display: flex; flex-wrap: wrap;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }
        .fechar-modal-produto {
            position: absolute; right: 25px; top: 20px; font-size: 32px; color: var(--text-muted); 
            cursor: pointer; z-index: 10; transition: 0.3s; line-height: 1;
        }
        .fechar-modal-produto:hover { color: var(--brand-gold); transform: rotate(90deg); }

        .galeria-produto {
            flex: 1 1 450px; padding: 40px; background-color: rgba(0,0,0,0.2); 
            border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; align-items: center;
        }
        .imagem-principal-box {
            width: 100%; max-width: 400px; height: 450px; background-color: var(--studio-light);
            border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px;
        }
        .imagem-principal-box img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; border-radius: 12px; }
        
        .info-produto { flex: 1 1 350px; padding: 50px 40px; display: flex; flex-direction: column; justify-content: center; }
        .info-produto h2 { font-family: 'Montserrat', sans-serif; font-size: 2rem; margin-bottom: 5px; color: #fff; font-weight: 700; }
        .info-produto .ref { font-size: 0.8rem; color: var(--brand-gold); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        .info-produto .preco-grande { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 700; color: #fff; margin-bottom: 25px; }

        /* CAMPOS DE COMPRA */
        .campo-input {
            width: 100%; padding: 16px; margin-bottom: 15px; background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;
            font-weight: 500; font-size: 1rem; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif;
        }
        .campo-input:focus { border-color: var(--brand-gold); background-color: rgba(212,175,55,0.05); }
        .campo-input option { background-color: #111; color: #fff; }
        
        .row-inputs { display: flex; gap: 15px; }
        .row-inputs .campo-input { flex: 1; }

        .btn-comprar-modal {
            width: 100%; background-color: var(--brand-gold); color: #000; padding: 18px 0; border: none;
            border-radius: 8px; font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; 
            cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 10px 20px rgba(212,175,55,0.2);
        }
        .btn-comprar-modal:hover { background-color: var(--brand-gold-hover); transform: translateY(-2px); box-shadow: 0 12px 25px rgba(212,175,55,0.4); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        @media (max-width: 768px) {
            .modal-produto-conteudo { flex-direction: column; }
            .galeria-produto { padding: 30px 20px; border-right: none; border-bottom: 1px solid var(--border-glass); }
            .info-produto { padding: 30px 20px; }
            .imagem-principal-box { height: 350px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Zuffen & Valenza" class="logo-topo" onerror="this.src='https://via.placeholder.com/250x60/111/fff?text=ZUFFEN+%26+VALENZA'">
        <p class="tagline-marca">ELEVANDO O PADRÃO DO STREETWEAR</p>
    </header>

    <div class="container-produtos">
        <div class="secao-header">
            <h2 class="titulo-secao">ACERVO PREMIUM</h2>
        </div>
        <main class="galeria" id="galeria"></main>
    </div>

    <!-- MODAL DE COMPRA -->
    <div id="modal-produto" class="modal-produto-fundo">
        <div class="modal-produto-conteudo" id="conteudo-produto">
            <!-- Gerado via JavaScript -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÃO DO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCdQQoHnMSq-smctTZR_b9cc2-7tRuQo6o",
            authDomain: "zv-erp.firebaseapp.com",
            projectId: "zv-erp",
            storageBucket: "zv-erp.firebasestorage.app",
            messagingSenderId: "1001920780615",
            appId: "1:1001920780615:web:a4d7cba54cdb55b6769462"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==========================================
        // DADOS DA LOJA E DOMÍNIO
        // ==========================================
        const precoFixo = 89.90;
        const precoFormatado = precoFixo.toFixed(2).replace('.', ',');
        const numeroWhatsApp = "5547996720018";
        
        // Domínio oficial para puxar a foto no WhatsApp
        const dominioDoSite = "https://zuffenvalenza.github.io/"; 

        const estampas = [
            { id: 'ZV-001', nome: 'Skulls & Tricks "Jumps"', imagens: ['ZV-001.png'] },
            { id: 'ZV-002', nome: 'Grizzly "Bold Streets"', imagens: ['ZV-002.png'] },
            { id: 'ZV-003', nome: 'Primal Instinct', imagens: ['ZV-003.png'] },
            { id: 'ZV-004', nome: 'Neon Tiger "Furious"', imagens: ['ZV-004.png'] },
            { id: 'ZV-005', nome: 'Knockout "Passion"', imagens: ['ZV-005.png'] },
            { id: 'ZV-006', nome: 'King Of The Street', imagens: ['ZV-006.png'] },
            { id: 'ZV-007', nome: 'Urban Chameleon', imagens: ['ZV-007.png'] },
            { id: 'ZV-008', nome: 'Hustle Shark', imagens: ['ZV-008.png'] },
            { id: 'ZV-009', nome: 'Silenced Liberty', imagens: ['ZV-009.png'] },
            { id: 'ZV-010', nome: 'Devotion "Liberate"', imagens: ['ZV-010.png'] },
            { id: 'ZV-011', nome: 'Lunar Dove "Dream"', imagens: ['ZV-011.png'] },
            { id: 'ZV-012', nome: 'Dollar Cherub', imagens: ['ZV-012.png'] },
            { id: 'ZV-013', nome: 'Rich Baby O.G.', imagens: ['ZV-013.png'] },
            { id: 'ZV-014', nome: 'Rebel Archangel', imagens: ['ZV-014.png'] }
        ];

        function renderizarGaleria() {
            const galeria = document.getElementById('galeria');
            galeria.innerHTML = ''; 
            estampas.forEach((estampa) => {
                galeria.innerHTML += `
                    <div class="card-vitrine" onclick="abrirDetalhesProduto('${estampa.id}')">
                        <div class="img-container">
                            <img src="${estampa.imagens[0]}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/e8e8e8/333?text=ZV'">
                        </div>
                        <div class="nome">${estampa.nome}</div>
                        <div class="preco">R$ ${precoFormatado}</div>
                    </div>
                `;
            });
        }

        function abrirDetalhesProduto(idProduto) {
            const produto = estampas.find(e => e.id === idProduto);
            const containerModal = document.getElementById('conteudo-produto');
            
            // POKA-YOKE: Transforma aspas duplas em código HTML seguro para o clique não quebrar
            const nomeSeguro = produto.nome.replace(/"/g, '&quot;');
            
            containerModal.innerHTML = `
                <span class="fechar-modal-produto" onclick="fecharDetalhesProduto()">&times;</span>
                
                <div class="galeria-produto">
                    <div class="imagem-principal-box">
                        <img src="${produto.imagens[0]}" id="img-principal-modal">
                    </div>
                </div>

                <div class="info-produto">
                    <div class="ref">REF // ${produto.id}</div>
                    <h2>${produto.nome}</h2>
                    <div class="preco-grande">R$ ${precoFormatado}</div>
                    
                    <input type="text" id="nome-cliente" class="campo-input" placeholder="Seu Nome Completo" autocomplete="off">

                    <div class="row-inputs">
                        <select id="tamanho-modal" class="campo-input">
                            <option value="" disabled selected>TAMANHO</option>
                            <option value="P">Tamanho P</option>
                            <option value="M">Tamanho M</option>
                            <option value="G">Tamanho G</option>
                            <option value="GG">Tamanho GG</option>
                        </select>

                        <input type="number" id="qtd-modal" class="campo-input" value="1" min="1" placeholder="Qtd">
                    </div>

                    <!-- Passando o nomeSeguro para não quebrar a função JavaScript -->
                    <button onclick="enviarPedidoAutomatizado('${produto.id}', '${nomeSeguro}', '${produto.imagens[0]}')" class="btn-comprar-modal">
                        FINALIZAR COMPRA
                    </button>
                    
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 15px; text-align: center;">
                        Você será redirecionado para o nosso WhatsApp oficial.
                    </p>
                </div>
            `;
            document.body.style.overflow = 'hidden'; 
            document.getElementById('modal-produto').classList.add('ativo');
        }

        // ==========================================
        // O MOTOR DE AUTOMAÇÃO (LOJA -> NUVEM -> WHATSAPP)
        // ==========================================
        function enviarPedidoAutomatizado(idEstampa, nomeEstampa, nomeImagem) {
            const nomeCliente = document.getElementById('nome-cliente').value.trim();
            const tamanho = document.getElementById('tamanho-modal').value;
            const qtd = parseInt(document.getElementById('qtd-modal').value);

            // Reverte o &quot; para aspas normais apenas para gravar no banco e enviar no WhatsApp
            const nomeEstampaOriginal = nomeEstampa.replace(/&quot;/g, '"');

            if (!nomeCliente) { alert("Por favor, informe o seu nome para continuarmos."); document.getElementById('nome-cliente').focus(); return; }
            if (!tamanho) { alert("Por favor, selecione um tamanho."); document.getElementById('tamanho-modal').focus(); return; }
            if (!qtd || qtd < 1) { alert("Quantidade inválida."); return; }

            // 1. GERAÇÃO DO CÓDIGO (SKU)
            const sku = `ZV-${idEstampa.split('-')[1]}-${tamanho}-${Math.floor(100 + Math.random() * 900)}`;
            const d = new Date();
            const dataHoje = d.toLocaleDateString('pt-BR');
            const mesAno = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

            // 2. DISPARO INVISÍVEL PARA O SEU ERP (FIREBASE)
            const novoPedidoERP = {
                sku: sku,
                cliente: nomeCliente,
                whatsapp: "Via Loja Online",
                estampa: idEstampa,
                tamanho: tamanho,
                qtd: qtd,
                preco: precoFixo,
                status: 0, // Cai direto na coluna "1. NOVO PEDIDO"
                data: dataHoje,
                mesAno: mesAno,
                timestamp: Date.now()
            };
            
            // Grava silenciosamente na Nuvem
            db.collection("pedidos").add(novoPedidoERP).catch(err => console.error("Erro Nuvem:", err));

            // 3. PREPARAÇÃO DO TEXTO COM O LINK DA FOTO PARA O WHATSAPP
            const linkDaFoto = `${dominioDoSite}${nomeImagem}`;
            
            const textoWhatsApp = `Olá, Zuffen & Valenza! Sou o *${nomeCliente}* e quero finalizar a minha compra:\n\n` +
                                  `▸ *Peça:* ${nomeEstampaOriginal} (${idEstampa})\n` +
                                  `▸ *Tamanho:* ${tamanho}\n` +
                                  `▸ *Quantidade:* ${qtd} un.\n` +
                                  `▸ *Total:* R$ ${(precoFixo * qtd).toFixed(2).replace('.', ',')}\n\n` +
                                  `Confira o modelo que escolhi: ${linkDaFoto}`;

            const urlFinal = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(textoWhatsApp)}`;
            
            // Fecha a janela e abre o WhatsApp
            fecharDetalhesProduto();
            window.open(urlFinal, '_blank');
        }

        function fecharDetalhesProduto() { 
            document.getElementById('modal-produto').classList.remove('ativo'); 
            document.body.style.overflow = 'auto'; 
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('modal-produto')) fecharDetalhesProduto();
        }

        window.onload = renderizarGaleria;
    </script>
</body>
</html>
